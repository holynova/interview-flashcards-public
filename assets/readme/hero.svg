<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">面试慢练 — 设计师面试闪卡</title>
  <desc id="desc">暖纸底极简风：面试慢练；右侧两张叠放的闪卡，前卡是问题如何平衡个人生活和工作，后卡露出答题思路的 bullet 列表。</desc>

  <rect width="1200" height="360" rx="26" fill="#f7f3eb"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6b5c40">设计师面试 · DESIGN INTERVIEW FLASHCARDS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#2b2620">面试慢练</text>
    <text x="56" y="168" font-size="23" fill="#8a4a2a">先用自己的话回答，再看答题思路和参考回答</text>
    <text x="56" y="204" font-size="19" fill="#6b5c40">32 道平面设计师面试闪卡，手机上慢慢练。</text>
    <g id="chips" font-size="18" fill="#2b2620" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#efe7d3" stroke="#d8cbb0" stroke-width="1.5"/><text x="119" y="262">32 道题</text></g>
      <g><rect x="194" y="238" width="138" height="36" rx="18" fill="#efe7d3" stroke="#d8cbb0" stroke-width="1.5"/><text x="263" y="262">19 个追问</text></g>
      <g><rect x="344" y="238" width="126" height="36" rx="18" fill="#efe7d3" stroke="#d8cbb0" stroke-width="1.5"/><text x="407" y="262">7 个分类</text></g>
      <g><rect x="482" y="238" width="174" height="36" rx="18" fill="#efe7d3" stroke="#d8cbb0" stroke-width="1.5"/><text x="569" y="262">零追踪 · 零字体</text></g>
    </g>
  </g>

  <g id="cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="830" y="44" font-size="18" fill="#6b5c40">01 / 32 · 职业选择</text>
    <!-- back card (answer), top-right -->
    <g>
      <rect x="880" y="56" width="280" height="200" rx="14" fill="#ffffff" stroke="#d8cbb0" stroke-width="1.5"/>
      <text x="904" y="88" font-size="17" fill="#8a4a2a">答题思路</text>
      <g font-size="15" fill="#5a4f3e">
        <text x="904" y="114">· 考察：日常精力与时间安排</text>
        <text x="904" y="138">· 上下班界限分明，讲求效率</text>
      </g>
    </g>
    <!-- front card (question), bottom-left -->
    <g>
      <rect x="780" y="140" width="280" height="200" rx="14" fill="#fbf8f1" stroke="#c9b896" stroke-width="2"/>
      <text x="804" y="182" font-size="24" font-weight="700" fill="#2b2620">如何平衡个人生活</text>
      <text x="804" y="216" font-size="24" font-weight="700" fill="#2b2620">和工作？</text>
      <text x="1044" y="322" font-size="15" fill="#6b5c40" text-anchor="end">‹ 01 / 32 ›</text>
      <g id="reveal-btn">
        <rect x="804" y="272" width="108" height="34" rx="17" fill="#8a4a2a"/>
        <text x="858" y="294" font-size="17" fill="#fbf8f1" text-anchor="middle">查看答案</text>
      </g>
    </g>
  </g>
</svg>
